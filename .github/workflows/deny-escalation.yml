name: Reject container and token escalation
run-name: "Attack probes — expected rejections: containers and tokens / ${{ github.head_ref || github.ref_name }}"
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  empty-token-secret:
    name: "Attack probe — expected rejection: empty-token-secret"
    if: ${{ always() && vars.FR_SECURITY_TEST_ENABLED == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}
    runs-on:
      group: ${{ vars.FLARERUNNER_RUNNER_GROUP }}
      labels: [self-hosted, flarerunner-1x]
    timeout-minutes: 3
    permissions: {}
    environment:
      name: security-canary
      deployment: false
    env:
      SECURITY_CANARY: ${{ secrets.FR_SECURITY_CANARY }}
    steps:
      - name: Must never execute
        run: echo FR_SECURITY_BOUNDARY_BREACH; exit 1
  artifact-read:
    name: "Attack probe — expected rejection: artifact-read"
    needs: empty-token-secret
    if: ${{ always() && vars.FR_SECURITY_TEST_ENABLED == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}
    runs-on:
      group: ${{ vars.FLARERUNNER_RUNNER_GROUP }}
      labels: [self-hosted, flarerunner-1x]
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    steps:
      - name: Must never execute
        run: echo FR_SECURITY_BOUNDARY_BREACH; exit 1
  checks-write:
    name: "Attack probe — expected rejection: checks-write"
    needs: artifact-read
    if: ${{ always() && vars.FR_SECURITY_TEST_ENABLED == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}
    runs-on:
      group: ${{ vars.FLARERUNNER_RUNNER_GROUP }}
      labels: [self-hosted, flarerunner-1x]
    timeout-minutes: 3
    permissions:
      checks: write
      contents: read
    steps:
      - name: Must never execute
        run: echo FR_SECURITY_BOUNDARY_BREACH; exit 1
  job-container-secret:
    name: "Attack probe — expected rejection: job-container-secret"
    needs: checks-write
    if: ${{ always() && vars.FR_SECURITY_TEST_ENABLED == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}
    runs-on:
      group: ${{ vars.FLARERUNNER_RUNNER_GROUP }}
      labels: [self-hosted, flarerunner-1x]
    timeout-minutes: 3
    environment:
      name: security-canary
      deployment: false
    container:
      image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
      env:
        SECURITY_CANARY: ${{ secrets.FR_SECURITY_CANARY }}
    steps:
      - name: Must never execute
        run: echo FR_SECURITY_BOUNDARY_BREACH; exit 1
  service-container-secret:
    name: "Attack probe — expected rejection: service-container-secret"
    needs: job-container-secret
    if: ${{ always() && vars.FR_SECURITY_TEST_ENABLED == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}
    runs-on:
      group: ${{ vars.FLARERUNNER_RUNNER_GROUP }}
      labels: [self-hosted, flarerunner-1x]
    timeout-minutes: 3
    environment:
      name: security-canary
      deployment: false
    services:
      untrusted:
        image: ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
        env:
          SECURITY_CANARY: ${{ secrets.FR_SECURITY_CANARY }}
    steps:
      - name: Must never execute
        run: echo FR_SECURITY_BOUNDARY_BREACH; exit 1
  docker-action-write-token:
    name: "Attack probe — expected rejection: docker-action-write-token"
    needs: service-container-secret
    if: ${{ always() && vars.FR_SECURITY_TEST_ENABLED == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}
    runs-on:
      group: ${{ vars.FLARERUNNER_RUNNER_GROUP }}
      labels: [self-hosted, flarerunner-1x]
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Must never execute
        uses: docker://ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
        with:
          entrypoint: /bin/sh
          args: -c 'echo FR_SECURITY_BOUNDARY_BREACH; exit 1'
