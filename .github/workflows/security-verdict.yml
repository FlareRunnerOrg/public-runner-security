name: Security verdict
run-name: Security verdict for ${{ github.event.workflow_run.name || inputs.run_id }}
on:
  workflow_run:
    workflows:
      - Public runner security
      - Reject credential-bearing untrusted jobs
      - Reject container and token escalation
      - Reject privileged PR trigger
      - Reject privileged workflow completion trigger
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed fixture run to verify
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' && vars.FR_SECURITY_TEST_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted verifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FlareRunnerOrg/public-runner-security
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - name: Require the complete security contract
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: bun scripts/verify-run.ts "$FIXTURE_RUN_ID" auto
