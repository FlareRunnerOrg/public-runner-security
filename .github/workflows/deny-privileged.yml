name: Reject privileged PR trigger
run-name: "Attack probe — expected rejection: privileged PR trigger / PR ${{ github.event.pull_request.number }}"
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  pull-request-target:
    name: "Attack probe — expected rejection: pull-request-target"
    continue-on-error: true
    if: ${{ vars.FR_SECURITY_TEST_ENABLED == 'true' }}
    runs-on:
      group: ${{ vars.FLARERUNNER_RUNNER_GROUP }}
      labels: [self-hosted, flarerunner-1x]
    timeout-minutes: 3
    steps:
      - name: Must never execute
        run: echo FR_SECURITY_BOUNDARY_BREACH; exit 1
