name: Reject privileged workflow completion trigger
run-name: "Attack probe — expected rejection: workflow completion / source ${{ github.event.workflow_run.id }}"
on:
  workflow_run:
    workflows: [Public runner security]
    types: [completed]
permissions:
  contents: read
jobs:
  workflow-run:
    name: "Attack probe — expected rejection: workflow-run"
    if: ${{ vars.FR_SECURITY_TEST_ENABLED == 'true' }}
    runs-on:
      group: ${{ vars.FLARERUNNER_RUNNER_GROUP }}
      labels: [self-hosted, flarerunner-1x]
    timeout-minutes: 3
    steps:
      - name: Must never execute
        run: echo FR_SECURITY_BOUNDARY_BREACH; exit 1
